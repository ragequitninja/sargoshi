[flake8]
max-line-length = 120
# E203: whitespace before ':' (Black)
# E501: line too long (Black / Ruff own line length)
# E704: statement on same line as def (Black compacts `...`-only stub bodies)
# W503/W504: line break before/after a binary operator (Black)
# D202: no blank lines after a function docstring
extend-ignore =
    E203,
    E501,
    E704,
    W503,
    W504,
    D202
