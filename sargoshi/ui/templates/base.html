<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sargoshi</title>
  <script src="{{ url_for('ui.static', filename='htmx.min.js') }}"></script>
  <style>
    /* Home Assistant design tokens (default theme). Light values here, dark in the
       media query below, so the UI follows the viewer's mode — matching HA when
       embedded as an add-on (ingress). Names mirror HA's CSS custom properties. */
    :root {
      color-scheme: light;
      --primary-color: #03a9f4;
      --dark-primary-color: #0288d1;
      --accent-color: #ff9800;
      --primary-background-color: #fafafa;
      --secondary-background-color: #e5e5e5;
      --card-background-color: #ffffff;
      --primary-text-color: #212121;
      --secondary-text-color: #727272;
      --divider-color: rgba(0, 0, 0, .12);
      --error-color: #db4437;
      --input-background-color: #ffffff;
      --app-header-background-color: var(--primary-color);
      --app-header-text-color: #ffffff;
      --ha-card-border-radius: 12px;
      --ha-card-box-shadow: 0 2px 2px 0 rgba(0, 0, 0, .14),
                            0 1px 5px 0 rgba(0, 0, 0, .12),
                            0 3px 1px -2px rgba(0, 0, 0, .2);
      --primary-tint: rgba(3, 169, 244, .10);
      --error-tint: rgba(219, 68, 55, .12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --primary-background-color: #111111;
        --secondary-background-color: #202020;
        --card-background-color: #1c1c1c;
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --divider-color: rgba(225, 225, 225, .12);
        --input-background-color: #202020;
        --app-header-background-color: #1c1c1c;
        --app-header-text-color: #e1e1e1;
        --ha-card-box-shadow: none;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.5 Roboto, "Helvetica Neue", -apple-system, BlinkMacSystemFont,
            "Segoe UI", sans-serif;
      background: var(--primary-background-color);
      color: var(--primary-text-color);
    }

    /* App bar — HA toolbar: primary blue in light, dark surface in dark mode. */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: .6rem;
      height: 56px;
      padding: 0 1.25rem;
      background: var(--app-header-background-color);
      color: var(--app-header-text-color);
      box-shadow: var(--ha-card-box-shadow);
    }
    @media (prefers-color-scheme: dark) {
      header { border-bottom: 1px solid var(--divider-color); }
    }
    header h1 { margin: 0; font-size: 1.15rem; font-weight: 500; letter-spacing: .01em; }
    header .sub { font-size: .8rem; font-weight: 400; opacity: .85; }

    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 1.25rem;
      display: grid;
      gap: 1.25rem;
    }
    /* Two cards side by side on wide screens; stacks when the iframe is narrow. */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    /* ha-card */
    .card {
      background: var(--card-background-color);
      border-radius: var(--ha-card-border-radius);
      box-shadow: var(--ha-card-box-shadow);
      padding: 16px 20px;
      overflow-x: auto;  /* wide tables scroll inside the card, not the page */
    }
    @media (prefers-color-scheme: dark) {
      .card { border: 1px solid var(--divider-color); }
    }
    .card h2 { margin: 0 0 .9rem; font-size: 1.05rem; font-weight: 500; }

    label { display: block; font-size: .8rem; color: var(--secondary-text-color); margin-bottom: .5rem; }
    input, select {
      width: 100%;
      padding: .5rem .6rem;
      margin-top: .25rem;
      font: inherit;
      color: inherit;
      background: var(--input-background-color);
      border: 1px solid var(--divider-color);
      border-radius: 4px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 1px var(--primary-color);
    }
    input[type="file"] { padding: .4rem; background: transparent; }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .75rem; }

    /* Material buttons — filled primary; text variants for secondary/danger. */
    button {
      font: inherit;
      font-weight: 500;
      padding: .55rem 1rem;
      border: none;
      border-radius: 4px;
      background: var(--primary-color);
      color: #fff;
      cursor: pointer;
      transition: background .15s ease;
    }
    button:hover { background: var(--dark-primary-color); }
    button:disabled { opacity: .5; cursor: default; background: var(--primary-color); }
    button.secondary { background: transparent; color: var(--primary-color); }
    button.secondary:hover { background: var(--primary-tint); }
    button.danger { background: transparent; color: var(--error-color); }
    button.danger:hover { background: var(--error-tint); }
    button.small { padding: .3rem .55rem; font-size: .82rem; }

    a { color: var(--primary-color); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .hint { color: var(--secondary-text-color); font-size: .82rem; margin: .5rem 0 0; }
    .hint code, code { background: var(--secondary-background-color); border-radius: 4px;
                       padding: .05rem .3rem; font-size: .85em; }

    dl.kv { display: grid; grid-template-columns: auto 1fr; gap: .35rem .75rem; margin: 0; }
    dl.kv dt { color: var(--secondary-text-color); }
    dl.kv dd { margin: 0; }

    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: .55rem .5rem; border-bottom: 1px solid var(--divider-color); }
    th { color: var(--secondary-text-color); font-weight: 500; }
    tr:last-child td { border-bottom: none; }

    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem;
            color: var(--secondary-text-color); }

    /* Chip — HA-style pill for model / device tags. */
    .tag {
      display: inline-block;
      font-size: .72rem;
      color: var(--secondary-text-color);
      background: var(--secondary-background-color);
      border-radius: 12px;
      padding: .1rem .55rem;
    }
    /* The active speaker-embedding model (new voiceprints are tagged with it). */
    .tag.active { background: var(--primary-color); color: #fff; }

    .msg { padding: .6rem .8rem; border-radius: 6px; margin-bottom: .85rem; font-size: .88rem; }
    .msg.ok { background: var(--primary-tint); }
    .msg.error { background: var(--error-tint); }

    .htmx-indicator { color: var(--secondary-text-color); font-size: .85rem; margin-left: .5rem; opacity: 0; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
    form > * + * { margin-top: .85rem; }
  </style>
</head>
<body>
  <header>
    <h1>sargoshi</h1>
    <span class="sub">management</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
