[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sargoshi"
version = "0.1.0"
description = "Speech-to-text and speaker-identification service: Wyoming, OpenAI REST, and gRPC frontends over one warm model pool."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Pieter Harvey", email = "pieter.harvey@icloud.com" }]
keywords = [
  "whisper",
  "speech-to-text",
  "asr",
  "wyoming",
  "home-assistant",
  "speaker-identification",
]

dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "ruamel.yaml>=0.18",
  "wyoming>=1.5",
  "quart>=0.19",
  "hypercorn>=0.16",
  "jinja2>=3.1",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "torch>=2.2",
]

[project.optional-dependencies]
ctranslate2 = [
  "faster-whisper>=1.0",
]
speechbrain = [
  "speechbrain>=1.0",
]
wavlm = [
  "transformers>=4.20,<5",
]
wavlm-openvino = [
  "optimum-intel[openvino]>=1.16",
  "transformers>=4.20,<5",
]

cpu = [
  "sargoshi[ctranslate2,speechbrain,wavlm]",
]
cuda = [
  "sargoshi[ctranslate2,speechbrain,wavlm]",
]
openvino = [
  "sargoshi[ctranslate2,speechbrain,wavlm-openvino]",
]

[project.scripts]
sargoshi = "sargoshi.__main__:main"

[dependency-groups]
dev = [# proto codegen
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.9",
  "types-pyyaml>=6.0",
  "pylint>=3.0",
  "poethepoet>=0.24",
]

[project.urls]
"Source Code" = "http://github.com/ragequitninja/sargoshi"

[tool.poetry]
requires-poetry = ">=2.0"

[tool.setuptools]
platforms = ["any"]
zip-safe  = true
include-package-data = true

[tool.setuptools.packages.find]
include = ["sargoshi", "sargoshi.*"]
exclude = ["tests", "tests.*"]

[tool.coverage.run]
branch = true
source = ["sargoshi"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
packages = ["sargoshi"]

[[tool.mypy.overrides]]
module = [
  "faster_whisper.*",
  "speechbrain.*",
  "transformers.*",
  "optimum.*",
]
ignore_missing_imports = true

[tool.pylint."MESSAGES CONTROL"]
disable = [
  "abstract-method",
  "cyclic-import",
  "duplicate-code",
  "global-statement",
  "import-outside-toplevel",
  "inconsistent-return-statements",
  "locally-disabled",
  "not-context-manager",
  "too-few-public-methods",
  "too-many-arguments",
  "too-many-branches",
  "too-many-instance-attributes",
  "too-many-lines",
  "too-many-locals",
  "too-many-public-methods",
  "too-many-return-statements",
  "too-many-statements",
  "too-many-boolean-expressions",
  "unnecessary-pass",
  "unused-argument",
  "broad-except",
  "too-many-nested-blocks",
  "invalid-name",
  "unused-import",
  "fixme",
  "useless-super-delegation",
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "import-error",
  "consider-using-with",
  "R0917",
  "C0301",
]

[tool.poe.tasks.ruff]
help = "Lint (E/F + I) and check formatting with ruff"
sequence = [
  "ruff check sargoshi tests",
  "ruff format --check --diff sargoshi tests",
]
default_item_type = "cmd"

[tool.poe.tasks.ruff-fix]
help = "Auto-fix lint and reformat with ruff"
sequence = [
  "ruff check --fix sargoshi tests",
  "ruff format sargoshi tests",
]
default_item_type = "cmd"

[tool.poe.tasks.mypy]
help = "Type-check with mypy"
cmd = "mypy sargoshi tests"

[tool.poe.tasks.pylint]
help = "Lint with pylint (module and tests use their own configs)"
sequence = [
  "pylint sargoshi",
  "pylint tests --rcfile tests/.pylintrc",
]
default_item_type = "cmd"

[tool.poe.tasks.lint]
help = "Run ruff, mypy, and pylint"
sequence = ["ruff", "mypy", "pylint"]
default_item_type = "ref"
ignore_fail = "return_non_zero"

[tool.poe.tasks.test]
help = "Run the unit tests (pytest tests/unit)"
cmd = "pytest tests/unit"

[tool.poe.tasks.run]
help = "Run sargoshi; extra args pass through, e.g. poe run --config config.yaml"
cmd = "python -m sargoshi"