---
name: Build main

on:
  push:
    branches:
      - "main"

env:
  REGISTRY: ghcr.io

jobs:
  # Discover every docker/Dockerfile.<variant> and emit a build matrix, so a new
  # Dockerfile dropped into docker/ is picked up automatically — no edit here.
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Discover Dockerfiles
        id: set
        run: |
          matrix=$(find docker -maxdepth 1 -type f -name 'Dockerfile.*' | sort \
            | jq -R -s -c '{include: (split("\n") | map(select(length > 0))
                | map(. as $file
                      | ($file | sub("^docker/Dockerfile\\."; "")) as $variant
                      | {variant: $variant,
                         file: $file,
                         suffix: (if $variant == "cpu" then "" else "-\($variant)" end)}))}')
          echo "Discovered: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-and-push-image:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set lowercase registry and repository
        run: |
          echo "REGISTRY_LOWER=$(echo '${{ env.REGISTRY }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPOSITORY_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Build Docker Images (amd64 and arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create version files
        run: |
          echo "nightly" > version.txt
          echo "${{ github.sha }}" > version_githash.txt
          ls -ltr

      - name: Build and push Docker image (${{ matrix.variant }})
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/aarch64
          push: true
          # cpu is the default flavour (empty suffix) → :nightly; others → :nightly-<variant>
          tags: ${{ env.REGISTRY_LOWER }}/${{ env.REPOSITORY_LOWER }}:nightly${{ matrix.suffix }}
          labels: "nightly${{ matrix.suffix }}"
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true